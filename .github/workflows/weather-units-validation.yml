# Owner-requested units change only. Existing $0 Actions block stays unchanged.
name: Test weather display units
on:
  push:
    branches: ['develop/next-workspaces']
    paths: ['.github/workflows/weather-units-validation.yml','build/integrate_weather_units.py','app/src/weather-units.js','tests/weather-units.test.cjs','tests/weather_units_ui.py']
permissions:
  contents: write
concurrency:
  group: atlas-weather-units-validation
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.event.repository.private && github.repository == 'nortja/atlas-command' && contains(github.event.head_commit.message, '[atlas-units-qa]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Apply checked source integration and run all development code checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from pathlib import Path;p=Path('app/src/app.js');p.write_text(p.read_text(encoding='utf-8'),encoding='utf-8',newline='\n')"
          if ($LASTEXITCODE -ne 0) { throw 'Source normalization failed.' }
          python build/integrate_weather_units.py
          if ($LASTEXITCODE -ne 0) { throw 'Source integration failed.' }
          node --test tests/core.test.cjs tests/source-checks.test.cjs tests/store-identity.test.cjs tests/workspace-layout.test.cjs tests/lidar.test.cjs tests/weather-units.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Code checks failed.' }
          node --check app/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Renderer syntax failed.' }
          python -m py_compile tests/weather_units_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'UI test syntax failed.' }
      - name: Compile development executable on disposable Windows runner only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content packaging/store-config.json -Raw | ConvertFrom-Json
          if ($config.version -ne '1.1.0.0') { throw 'Unexpected development version.' }
          $stage = Join-Path $env:RUNNER_TEMP ('atlas-units-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $stage
          ('ATLAS_SMOKE_STAGE=' + $stage) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item -Path 'app/*' -Destination $stage -Recurse
          Copy-Item native/AtlasCommand.exe.config $stage
          $vs = Join-Path $stage 'VersionInfo.cs'
          [IO.File]::WriteAllText($vs, 'using System.Reflection; [assembly: AssemblyVersion("1.1.0.0")] [assembly: AssemblyFileVersion("1.1.0.0")]', [Text.UTF8Encoding]::new($false))
          $exe = Join-Path $stage 'AtlasCommand.exe'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $arguments = @(
            '/nologo', '/codepage:65001', '/target:winexe', '/platform:x64', '/optimize+', '/warn:4', '/warnaserror+',
            ('/out:' + $exe),
            ('/win32manifest:' + (Join-Path $PWD 'native/WindowsApp.manifest')),
            ('/win32icon:' + (Join-Path $PWD 'native/AtlasCommand.ico')),
            '/reference:System.dll,System.Core.dll,System.Web.Extensions.dll,System.Windows.Forms.dll',
            (Join-Path $PWD 'native/AtlasHost.cs'), (Join-Path $PWD 'native/AssemblyInfo.cs'), $vs
          )
          & $compiler @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }
          ('ATLAS_SMOKE_EXE=' + $exe) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test real settings toggles, saves, reload, failure and restart
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Test driver setup failed.' }
          python tests/weather_units_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Weather unit UI checks failed.' }
      - name: Commit only tested generated development files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/develop/next-workspaces') { throw 'Wrong branch.' }
          $paths = @('app/index.html','app/workspace-preview.html','app/src/app.js','native/AtlasHost.cs','build/Build-Store.ps1')
          & git add -- @paths
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed.' }
          $unexpected = @(git diff --cached --name-only | Where-Object { $_ -notin $paths })
          if ($unexpected.Count) { throw 'Unexpected staged path.' }
          & git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git -c user.name='Atlas development automation' -c user.email='atlas-dev@users.noreply.github.com' commit -m 'Integrate tested Fahrenheit/mph defaults and saved metric toggle in development'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
            $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:' + $env:GH_TOKEN))
            Write-Output ('::add-mask::' + $encoded)
            & git -c ('http.https://github.com/.extraheader=AUTHORIZATION: basic ' + $encoded) push origin HEAD:refs/heads/develop/next-workspaces
            if ($LASTEXITCODE -ne 0) { throw 'Branch moved or permission unavailable. No force push.' }
          }
          $report = Get-Content weather-units-output/WEATHER-UNITS-RESULTS.json -Raw | ConvertFrom-Json
          $report | Add-Member -NotePropertyName materializedCommit -NotePropertyValue ((git rev-parse HEAD).Trim())
          $report | ConvertTo-Json -Depth 8 | Set-Content weather-units-output/WEATHER-UNITS-RESULTS.json -Encoding utf8
      - name: Retain screenshots and test report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-weather-units-preview
          path: |
            weather-units-output/*.png
            weather-units-output/WEATHER-UNITS-RESULTS.json
          retention-days: 3
          if-no-files-found: warn
      - name: Remove temporary executable
        if: always()
        shell: pwsh
        run: |
          if ($env:ATLAS_SMOKE_STAGE -and (Test-Path -LiteralPath $env:ATLAS_SMOKE_STAGE)) {
            Remove-Item -LiteralPath $env:ATLAS_SMOKE_STAGE -Recurse -Force
          }
# No new live feeds, security exclusions, installed package, Store update, main-branch write or billing change.
