# Owner-authorized Live Earth development only. Preserve existing $0 spending block.
# No installer, signing, Store submission, publication, or employer-device actions.
name: Test Live Earth weather integration
on:
  push:
    branches: ['develop/next-workspaces']
    paths: ['.github/workflows/live-weather-validation.yml', 'build/integrate_live_weather.py', 'app/src/live-weather.js', 'app/src/live-weather.css', 'tests/live-weather.test.cjs', 'tests/live_weather_ui.py']
permissions:
  contents: write
concurrency:
  group: atlas-live-weather-development
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.event.repository.private && github.repository == 'nortja/atlas-command' && contains(github.event.head_commit.message, '[atlas-live-qa]') }}
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Integrate source and check all development logic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python build/integrate_live_weather.py
          if ($LASTEXITCODE -ne 0) { throw 'Source integration failed.' }
          node --check app/src/live-weather.js
          if ($LASTEXITCODE -ne 0) { throw 'Weather syntax failed.' }
          node --check app/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Application syntax failed.' }
          node --test tests/core.test.cjs tests/source-checks.test.cjs tests/store-identity.test.cjs tests/workspace-layout.test.cjs tests/lidar.test.cjs tests/weather-units.test.cjs tests/live-weather.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Code checks failed.' }
      - name: Compile only in disposable Windows storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content packaging/store-config.json -Raw | ConvertFrom-Json
          if ($config.version -ne '1.1.0.0' -or $config.developmentStatus -ne 'NOT_SUBMITTED_NOT_APPROVED') { throw 'Wrong development version.' }
          $stage = Join-Path $env:RUNNER_TEMP ('atlas-live-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $stage
          ('ATLAS_SMOKE_STAGE=' + $stage) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Copy-Item -Path 'app/*' -Destination $stage -Recurse
          Copy-Item native/AtlasCommand.exe.config $stage
          $vs = Join-Path $stage 'VersionInfo.cs'
          [IO.File]::WriteAllText($vs, 'using System.Reflection; [assembly: AssemblyVersion("1.1.0.0")] [assembly: AssemblyFileVersion("1.1.0.0")]', [Text.UTF8Encoding]::new($false))
          $exe = Join-Path $stage 'AtlasCommand.exe'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $arguments = @('/nologo','/codepage:65001','/target:winexe','/platform:x64','/optimize+','/warn:4','/warnaserror+',('/out:' + $exe),('/win32manifest:' + (Join-Path $PWD 'native/WindowsApp.manifest')),('/win32icon:' + (Join-Path $PWD 'native/AtlasCommand.ico')),'/reference:System.dll,System.Core.dll,System.Web.Extensions.dll,System.Windows.Forms.dll',(Join-Path $PWD 'native/AtlasHost.cs'),(Join-Path $PWD 'native/AssemblyInfo.cs'),$vs)
          & $compiler @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }
          ('ATLAS_SMOKE_EXE=' + $exe) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check existing workspaces and unit controls before weather
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Test driver setup failed.' }
          python tests/next_ui_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace regression test failed.' }
          python tests/weather_units_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Unit control regression test failed.' }
      - name: Verify real weather provider, global grid, offline fallback and screenshots
        shell: pwsh
        run: |
          python tests/live_weather_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Live weather verification failed.' }
      - name: Commit tested integration on the development branch only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -cne 'refs/heads/develop/next-workspaces') { throw 'Wrong branch.' }
          $paths = @('app/index.html','app/workspace-preview.html','app/src/app.js','app/src/globe.js','native/AtlasHost.cs','build/Build-Store.ps1')
          & git add -- @paths
          if ($LASTEXITCODE -ne 0) { throw 'Staging failed.' }
          $unexpected = @(git diff --cached --name-only | Where-Object { $_ -notin $paths })
          if ($unexpected.Count) { throw 'Unexpected staged path.' }
          & git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git -c user.name='Atlas development automation' -c user.email='atlas-dev@users.noreply.github.com' commit -m 'Integrate tested opt-in Live Earth weather and present-day sky rendering in development'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
            $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes('x-access-token:' + $env:GH_TOKEN))
            Write-Output ('::add-mask::' + $encoded)
            & git -c ('http.https://github.com/.extraheader=AUTHORIZATION: basic ' + $encoded) push origin HEAD:refs/heads/develop/next-workspaces
            if ($LASTEXITCODE -ne 0) { throw 'Branch moved or permission unavailable. No force push.' }
          }
          $report = Get-Content live-weather-output/LIVE-WEATHER-RESULTS.json -Raw | ConvertFrom-Json
          $report | Add-Member -NotePropertyName materializedCommit -NotePropertyValue ((git rev-parse HEAD).Trim())
          $report | ConvertTo-Json -Depth 12 | Set-Content live-weather-output/LIVE-WEATHER-RESULTS.json -Encoding utf8
      - name: Retain screenshots and validation reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-live-earth-preview
          path: |
            live-weather-output/*.png
            live-weather-output/LIVE-WEATHER-RESULTS.json
            next-test-output/NEXT-TEST-RESULTS.json
            weather-units-output/WEATHER-UNITS-RESULTS.json
          retention-days: 3
          if-no-files-found: warn
      - name: Remove temporary executable
        if: always()
        shell: pwsh
        run: |
          if ($env:ATLAS_SMOKE_STAGE -and (Test-Path -LiteralPath $env:ATLAS_SMOKE_STAGE)) { Remove-Item -LiteralPath $env:ATLAS_SMOKE_STAGE -Recurse -Force }
