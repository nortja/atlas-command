# Private same-day owner preview. Builds and tests only; never installs on the owner's PC or uploads to Store.
# Validation revision: compact weather ribbon is viewport-bounded; the one approved NASA visual basemap is isolated in CI.
# Power lifecycle revision: minimized windows stay alive, a second launch reopens the validated local session, shutdown exits cleanly, and the last globe view is restored.
# Content-update revision: bundled catalog is moving toward 300 source-first records; remote content is signature-gated and fail-closed until provisioned.
# QC revision: catalog cardinality is derived from the actual bundled arrays so expansion batches cannot silently drift from the UI.
name: Build Atlas owner preview
on:
  push:
    branches: ['develop/ui-directions']
    paths: ['.github/workflows/owner-preview.yml','build/Build-OwnerPreview.ps1','packaging/owner-preview/**','tests/owner-preview.test.cjs','tests/live-weather.test.cjs','tests/windows_native_smoke.py','tests/next_ui_test.py','build/integrate_field_camera_onvif_service.py','build/integrate_windows_webcam.py','app/src/windows-webcam.js','app/src/windows-webcam.css','tests/windows-webcam.test.cjs','tests/windows_webcam_ui.py','build/integrate_experience_push.py','app/src/weather-desk.js','app/src/weather-desk.css','app/src/ocean-currents.js','app/src/ocean-currents.css','app/src/site-detail-enhance.js','app/src/site-detail-enhance.css','tests/experience-push.test.cjs','tests/experience_ui.py','build/integrate_visual_hd_push.py','build/integrate_catalog_r6_remote_updates.py','build/integrate_catalog_r7_discovery.py','build/integrate_catalog_r8.py','app/src/weather-ribbon.js','app/src/weather-ribbon.css','app/src/earth-physical.js','app/src/satellite-earth.js','app/src/satellite-earth.css','app/src/remote-updates.js','app/data/site-expansion.js','app/data/site-expansion-r5.js','app/data/site-expansion-r6.js','app/data/site-expansion-r7.js','app/data/site-expansion-r8.js','tests/remote-updates.test.cjs','tests/visual-hd-push.test.cjs','tests/satellite-earth.test.cjs','tests/visual_hd_ui.py','build/integrate_power_lifecycle.py','app/src/power-controls.css','tests/power-lifecycle.test.cjs','tests/power_lifecycle_ui.py']
permissions:
  contents: read
concurrency:
  group: atlas-owner-preview
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.event.repository.private && github.repository == 'nortja/atlas-command' && contains(github.event.head_commit.message, '[atlas-owner-preview]') }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Integrate development source
        shell: pwsh
        run: |
          python build/integrate_release_tools.py
          if ($LASTEXITCODE -ne 0) { throw 'Release-tool integration failed.' }
          python build/integrate_ui_directions.py
          if ($LASTEXITCODE -ne 0) { throw 'UI integration failed.' }
          python build/integrate_field_cameras.py
          if ($LASTEXITCODE -ne 0) { throw 'Camera integration failed.' }
          python build/integrate_field_camera_route_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Camera route integration failed.' }
          python build/integrate_field_camera_onvif_service.py
          if ($LASTEXITCODE -ne 0) { throw 'Camera ONVIF integration failed.' }
          python build/integrate_windows_webcam.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows webcam integration failed.' }
          python build/integrate_experience_push.py
          if ($LASTEXITCODE -ne 0) { throw 'Experience integration failed.' }
          python build/integrate_visual_hd_push.py
          if ($LASTEXITCODE -ne 0) { throw 'HD planet integration failed.' }
          python build/integrate_catalog_r6_remote_updates.py
          if ($LASTEXITCODE -ne 0) { throw 'Catalog/update-channel integration failed.' }
          python build/integrate_power_lifecycle.py
          if ($LASTEXITCODE -ne 0) { throw 'Power lifecycle integration failed.' }
          python build/integrate_collaboration.py
          if ($LASTEXITCODE -ne 0) { throw 'Collaboration integration failed.' }
      - name: Run source and logic checks
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem tests/*.test.cjs | ForEach-Object { $_.FullName })
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw 'Source or logic checks failed.' }
      - name: Build private owner preview
        shell: pwsh
        run: |
          ./build/Build-OwnerPreview.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Owner preview build failed.' }
          $source = (Resolve-Path 'dist/AtlasCommand-OwnerPreview').Path
          $stage = Join-Path $env:RUNNER_TEMP ('atlas-owner-preview-smoke-' + [guid]::NewGuid().ToString('N'))
          $null = New-Item -ItemType Directory -Path $stage
          Copy-Item -Path (Join-Path $source '*') -Destination $stage -Recurse -Force
          $exe = Join-Path $stage 'AtlasCommand.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Temporary owner-preview executable was not staged.' }
          ('ATLAS_SMOKE_EXE=' + $exe) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          ('ATLAS_SMOKE_STAGE=' + $stage) | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise native app and current UI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Test driver setup failed.' }
          python tests/windows_native_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Native smoke test failed.' }
          python tests/next_ui_test.py
          if ($LASTEXITCODE -ne 0) { throw 'Workspace UI test failed.' }
          python tests/weather_units_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Weather units test failed.' }
          python tests/field_cameras_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Private camera profile UI test failed.' }
          python tests/field_camera_route_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Private camera route runtime test failed.' }
          python tests/field_camera_onvif_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Private camera ONVIF runtime test failed.' }
          python tests/windows_webcam_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows webcam UI runtime test failed.' }
          python tests/experience_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Experience UI runtime test failed.' }
          python tests/visual_hd_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'HD planet UI runtime test failed.' }
          python tests/power_lifecycle_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Power lifecycle runtime test failed.' }
      - name: Verify owner preview artifact
        shell: pwsh
        run: |
          $report = Get-Content dist/OWNER-PREVIEW-REPORT.json -Raw | ConvertFrom-Json
          if ($report.previewType -cne 'PRIVATE_OWNER_DEVELOPMENT' -or $report.signed -ne $false -or $report.storeCertified -ne $false -or $report.adminRequired -ne $false -or $report.securityBypass -ne $false) { throw 'Owner preview report has unsafe or inaccurate release state.' }
          $zip = Join-Path 'dist' $report.zip
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Owner preview ZIP missing.' }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $report.sha256) { throw 'Owner preview ZIP hash mismatch.' }
          if (Test-Path -LiteralPath 'dist/AtlasCommand-OwnerPreview/workspace.json') { throw 'Private workspace leaked into preview.' }
      - name: Upload private owner preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-owner-preview-windows-x64
          path: |
            dist/AtlasCommand-OwnerPreview-*-x64.zip
            dist/OWNER-PREVIEW-REPORT.json
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary verification copy
        if: always()
        shell: pwsh
        run: |
          if ($env:ATLAS_SMOKE_STAGE -and (Test-Path -LiteralPath $env:ATLAS_SMOKE_STAGE)) { Remove-Item -LiteralPath $env:ATLAS_SMOKE_STAGE -Recurse -Force }
# No signing, Store upload, public release, elevation, endpoint-security exception, or automated installation.
