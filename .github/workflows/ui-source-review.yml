name: Prepare UI source review
on:
  push:
    branches: ['develop/ui-directions']
    paths: ['.github/workflows/ui-source-review.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: ${{ github.event.repository.private && github.repository == 'nortja/atlas-command' && contains(github.event.head_commit.message, '[atlas-ui-source]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Archive tracked source only, no binaries or credentials
        run: git archive --format=zip --output=ui-source.zip HEAD app native build packaging tests docs .github/workflows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-ui-source
          path: ui-source.zip
          retention-days: 1
# No Store publication, installation, billing, security or main-branch changes.
