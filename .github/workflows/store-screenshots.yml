# Owner-requested one-shot screenshot job. The main branch and app payload are unchanged.
# Existing $0 Actions spending block remains in place. No Store upload or certificates.
name: Capture four real Store screenshots
on:
  push:
    branches: ['capture/store-screenshots-20260909']
    paths:
      - '.github/workflows/store-screenshots.yml'
      - 'tools/capture_store_screenshots.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-store-screenshots-once
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ github.event.repository.private && github.repository == 'nortja/atlas-command' && contains(github.event.head_commit.message, '[capture-atlas-now]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out capture automation only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned screenshot driver on the disposable runner only
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot driver setup failed.' }
          python -m py_compile tools/capture_store_screenshots.py
          if ($LASTEXITCODE -ne 0) { throw 'Capture script syntax check failed.' }
      - name: Capture unmodified Windows app payload using real native storage and Edge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/capture_store_screenshots.py
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot capture failed; inspect the log and diagnostic image.' }
      - name: Retain only screenshots and provenance in the private repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-four-real-screenshots
          path: |
            screenshots-output/*.png
            screenshots-output/CAPTURE-PROVENANCE.json
          if-no-files-found: warn
          retention-days: 3
# Requires this dedicated branch plus the explicit commit marker. No schedule,
# main-branch trigger, app publication, personal workspace upload or billing changes.
